<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bard College RKC Monitor SMS Alert Consent Form</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #111827;
        background: #f4f6f8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 620px);
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 14px 34px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.6rem, 3vw, 2rem);
        line-height: 1.15;
      }

      p {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.55;
      }

      a.button {
        display: inline-block;
        background: #1f2937;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 6px;
        padding: 14px 20px;
      }

      a.button:focus,
      a.button:hover {
        background: #374151;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bard College RKC Monitor SMS Alert Consent Form</h1>
      <p>Download and print the internal laboratory consent form for voluntary RKC Monitor SMS alert enrollment.</p>
      <a class="button" href="/consent.pdf" download>Download Consent Form (PDF)</a>
    </main>
  </body>
</html>
